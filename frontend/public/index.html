<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <title>Server Monitor</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>

  <h1>Server Monitor</h1>
  <p class="subtitle">Prati stanje servera — memorisi i pretrazi istoriju</p>

  <div class="buttons">
    <button id="btn-save">Memorisi trenutno stanje</button>
    <button id="btn-history"> Prikaži zadnjih 10 stanja</button>
  </div>

  <div id="message"></div>

  <div id="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Uptime (s)</th>
          <th>Slobodna memorija (MB)</th>
          <th>Ukupna memorija (MB)</th>
          <th>Zabilježeno u</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <script src="/src/app.js"></script>
</body>
</html>
