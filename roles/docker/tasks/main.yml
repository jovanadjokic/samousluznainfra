---

- name: Instaliraj sistemske pakete potrebne za Docker
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

- name: Napravi direktorijum za GPG ključeve
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'


- name: Dodaj zvanični Docker GPG ključ
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
    keyring: /etc/apt/keyrings/docker.gpg


- name: Dodaj Docker repozitorijum u apt izvore
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    state: present
    filename: docker


- name: Instaliraj Docker i Docker Compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes


- name: Osiguraj da je Docker servis pokrenut i omogućen
  service:
    name: docker
    state: started
    enabled: yes