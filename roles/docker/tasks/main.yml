---
- name: Potpuno ocisti sve starije ili konfliktne Docker fajlove i ključeve
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/sources.list.d/docker.list.save
    - /etc/apt/keyrings/docker.gpg
    - /etc/apt/keyrings/docker.asc
 
- name: Regenerisi cist sistemski sources.list fajl da se uklone skriveni konflikti
  copy:
    content: |
      deb http://rs.archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse
      deb http://rs.archive.ubuntu.com/ubuntu/ jammy-updates main restricted universe multiverse
      deb http://rs.archive.ubuntu.com/ubuntu/ jammy-backports main restricted universe multiverse
      deb http://security.ubuntu.com/ubuntu/ jammy-security main restricted universe multiverse
    dest: /etc/apt/sources.list
 
- name: Napravi direktorijum za ključeve sa ispravnim pravima pristupa
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
 
- name: Preuzmi svež Docker GPG ključ 
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: yes  
 
- name: Dodaj Docker repozitorijum i odmah osveži apt bazu
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu jammy stable"
    state: present
    filename: docker
    update_cache: yes  
 
- name: Instaliraj sistemske pakete potrebne za Docker
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: no
 
- name: Instaliraj Docker i Docker Compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: no
 
- name: Osiguraj da je Docker servis pokrenut i omogućen
  service:
    name: docker
    state: started
    enabled: yes
