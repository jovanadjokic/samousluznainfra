---
- name: Potpuno ocisti sve konfliktne fajlove Docker lista i kljuceva
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/sources.list.d/docker.list.save
    - /etc/apt/keyrings/docker.gpg
    - /etc/apt/keyrings/docker.asc

- name: Regenerisi cist sistemski sources.list fajl da se uklone skriveni konflikti
  copy:
    content: |
      deb http://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse
      deb http://archive.ubuntu.com/ubuntu/ jammy-updates main restricted universe multiverse
      deb http://archive.ubuntu.com/ubuntu/ jammy-backports main restricted universe multiverse
      deb http://security.ubuntu.com/ubuntu/ jammy-security main restricted universe multiverse
    dest: /etc/apt/sources.list

- name: Prisilno osvezi apt kroz ljusku nakon kompletnog reseta
  shell: apt-get clean && apt-get update
  ignore_errors: yes

- name: Instaliraj sistemske pakete potrebne za Docker
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: no

- name: Napravi direktorijum za GPG ključeve
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Dodaj zvanični Docker GPG ključ
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
    keyring: /etc/apt/keyrings/docker.gpg

- name: Dodaj Docker repozitorijum u apt izvore
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu jammy stable"
    state: present
    filename: docker

- name: Instaliraj Docker i Docker Compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: no

- name: Osiguraj da je Docker servis pokrenut i omogućen
  service:
    name: docker
    state: started
    enabled: yes
