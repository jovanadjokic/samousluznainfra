---

- name: Automatsko ciscenje konflikata na silu

  shell: |

    rm -f /etc/apt/sources.list.d/docker.list

    rm -f /etc/apt/sources.list.d/docker.list.save

    sed -i '/docker/d' /etc/apt/sources.list

    apt-get clean

  become: true

  ignore_errors: yes
 
- name: Instaliraj bazične sistemske pakete

  apt:

    name:

      - apt-transport-https

      - ca-certificates

      - curl

      - gnupg

      - lsb-release

    state: present

    update_cache: no

  become: true
 
- name: Napravi direktorijum za GPG ključeve

  file:

    path: /etc/apt/keyrings

    state: directory

    mode: '0755'

  become: true
 
- name: Preuzmi i dodaj zvanični Docker kljuc i repozitorijum direktno

  shell: |

    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg

    echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu jammy stable" > /etc/apt/sources.list.d/docker.list

    apt-get update

  become: true
 
- name: Instaliraj Docker i Docker Compose

  apt:

    name:

      - docker-ce

      - docker-ce-cli

      - containerd.io

      - docker-buildx-plugin

      - docker-compose-plugin

    state: present

    update_cache: no

  become: true
 
- name: Osiguraj da je Docker servis pokrenut i omogućen

  service:

    name: docker

    state: started

    enabled: yes

  become: true
 
---

- name: Ocisti sve moguce ostatke Docker repozitorijuma i kljuceva

  file:

    path: "{{ item }}"

    state: absent

  loop:

    - /etc/apt/sources.list.d/docker.list

    - /etc/apt/sources.list.d/docker.list.save

    - /etc/apt/keyrings/docker.gpg

    - /etc/apt/keyrings/docker.asc
 
- name: Ukloni Docker linije iz glavnog sources.list fajla ako postoje

  ansible.builtin.replace:

    path: /etc/apt/sources.list

    regexp: '^.*docker\.com.*$'

    replace: ''
 
- name: Prisilno ocisti apt i osvezi kes kroz ljusku

  shell: apt-get clean && apt-get update

  ignore_errors: yes
 
- name: Instaliraj sistemske pakete potrebne za Docker

  apt:

    name:

      - apt-transport-https

      - ca-certificates

      - curl

      - gnupg

      - lsb-release

    state: present

    update_cache: no
 
- name: Napravi direktorijum za GPG ključeve

  file:

    path: /etc/apt/keyrings

    state: directory

    mode: '0755'
 
- name: Dodaj zvanični Docker GPG ključ

  apt_key:

    url: https://download.docker.com/linux/ubuntu/gpg

    state: present

    keyring: /etc/apt/keyrings/docker.gpg
 
- name: Dodaj Docker repozitorijum u apt izvore

  apt_repository:

    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"

    state: present

    filename: docker
 
- name: Instaliraj Docker i Docker Compose plugin

  apt:

    name:

      - docker-ce

      - docker-ce-cli

      - containerd.io

      - docker-buildx-plugin

      - docker-compose-plugin

    state: present

    update_cache: no
 
- name: Osiguraj da je Docker servis pokrenut i omogućen

  service:

    name: docker

    state: started

    enabled: yes
 
